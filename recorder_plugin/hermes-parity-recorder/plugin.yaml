name: hermes-parity-recorder
version: 0.1.0
description: "Observer-only checkpoint recorder for hermes-parity. Writes content-free JSONL checkpoints (hashes, lengths, key-path shapes) for API requests, responses and tool calls. Never changes agent behavior; every hook fails open."
author: "Axiom (deployaxiom.com)"
license: MIT
provides_hooks:
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
